# Drives the Discord post in #releases.

project:
  name: Librarium MCP
  emoji: "📚"
  footer: "Librarium · self-hosted book, manga, and comic tracker"

channels:
  stable:
    announce: true
    colour: "0x2ECC71"
    prefix: ""
  rc:
    announce: true
    colour: "0xF1C40F"
    prefix: "Release candidate — "
  nightly:
    announce: false

getting_started: |
  Point Claude Desktop, Claude Code, or Cursor at the server, or pull it:
  ```
  docker pull {{image}}
  ```

links:
  - name: Source
    url: https://github.com/{{repo}}
  - name: Site
    url: https://librarium.press/
  - name: Changes
    url: "{{compare_url}}"
